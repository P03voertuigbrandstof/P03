:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#203047;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#173b59;color:white;padding:20px max(18px,calc((100vw - 1100px)/2))}h1{font-size:1.45rem;margin:0}header p{margin:5px 0 0;color:#d1e4f2}main{max-width:1100px;margin:auto;padding:20px 16px 70px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,.button{border:0;border-radius:9px;background:#176a9b;color:white;padding:11px 15px;font:inherit;cursor:pointer}button:hover{filter:brightness(.94)}button.secondary{background:#e5edf3;color:#163c58}button.danger{background:#a63139}nav button.active{background:#123c5a}.card{background:white;border:1px solid #e1e7ed;border-radius:13px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #1234}h2{font-size:1.2rem;margin:0 0 14px}h3{font-size:1rem;margin:8px 0}label{display:block;font-size:.9rem;font-weight:600;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #b9c9d6;border-radius:8px;padding:10px;font:inherit;background:white;color:#203047}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.muted{color:#657485}.metric{background:#f0f6fa;border-radius:10px;padding:13px}.metric strong{display:block;font-size:1.3rem;margin-top:4px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6ebf0;font-size:.91rem}th{background:#f3f7fa}td button{padding:7px 9px;margin:2px}.notice{background:#fff5df;padding:12px;border-radius:8px;margin:12px 0}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.empty{padding:18px;text-align:center;color:#63778a}.error{color:#a12630;font-weight:600;margin-top:10px}small{color:#62758a}@media(max-width:650px){main{padding:14px 10px}header{padding:18px}nav button{flex:1}h1{font-size:1.2rem}}
.reportfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.reportchart{display:flex;align-items:end;gap:8px;height:180px;overflow-x:auto;padding:8px 4px 25px;border-bottom:1px solid #cbd7e2}.reportbar{flex:1;min-width:32px;max-width:85px;background:#176a9b;border-radius:5px 5px 0 0;position:relative}.reportbar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:.73rem;white-space:nowrap}.reportnote{font-size:.88rem;color:#586b7c}.reportbad{color:#a12630;font-weight:600}.reporttable{min-width:610px}.reporttable td:last-child,.reporttable th:last-child{text-align:right}nav button{white-space:nowrap}</style></head><body><header><h1>P03 – Brandstofverbruik App</h1><p>Voertuigen, verbruik en kosten overzichtelijk bijhouden</p></header><main><nav id="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="vehicles">Voertuigen</button><button data-page="records">Registraties</button><button data-page="reports">Rapportages</button><button data-page="backup">Back-up</button></nav><div id="app"></div></main><script>
'use strict';const KEY='p03-data-v1';let state={vehicles:[],fuel:[],odometer:[],charges:[]},page='dashboard',selected='',editing=null;
const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('nl-NL',{style:'currency',currency:'EUR'}),num=(n,d=2)=>Number(n).toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}),uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random(),date=()=>new Date().toLocaleDateString('sv-SE');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&['vehicles','fuel','odometer','charges'].every(k=>Array.isArray(x[k])))state=x}catch(e){alert('Opgeslagen gegevens konden niet worden gelezen. Er is niets overschreven.')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Opslaan mislukt. Controleer de beschikbare browseropslag.');return false}}
function commit(next){const old=state;state=next;if(!save()){state=old;return false}return true}
const vehicle=()=>state.vehicles.find(v=>v.id===selected),sorted=a=>[...a].sort((x,y)=>x.date.localeCompare(y.date)||x.km-y.km||x.id.localeCompare(y.id));
function selectVehicle(){if(!state.vehicles.some(v=>v.id===selected))selected=state.vehicles[0]?.id||''}
function tabs(p){page=p;editing=null;render()}
$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)tabs(b.dataset.page)};
function selector(){return `<label for="vehicleSelect">Voertuig</label><select id="vehicleSelect">${state.vehicles.map(v=>`<option value="${v.id}" ${v.id===selected?'selected':''}>${escapeHtml(v.name)} (${v.type.toUpperCase()})</option>`).join('')}</select>`}
function render(){selectVehicle();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('app').innerHTML=({dashboard:dashboard,vehicles:vehiclesPage,records:recordsPage,reports:reportsPage,backup:backupPage})[page]();if($('vehicleSelect'))$('vehicleSelect').onchange=e=>{selected=e.target.value;editing=null;render()};attach()}
function dashboard(){if(!vehicle())return `<section class="card"><h2>Welkom bij P03</h2><p>Voeg eerst een voertuig toe om te beginnen.</p><button onclick="tabs('vehicles')">Voertuig toevoegen</button></section>`;const v=vehicle(),isEv=v.type==='ev',f=sorted(state.fuel.filter(x=>x.vehicleId===v.id)),o=sorted(state.odometer.filter(x=>x.vehicleId===v.id)),c=state.charges.filter(x=>x.vehicleId===v.id),km=Math.max(v.km,...f.map(x=>x.km),...o.map(x=>x.km));let metrics=[['Kilometerstand',num(km,0)+' km']];if(isEv){const est=evStats(o);const total=c.reduce((s,x)=>s+x.kwh,0),cost=c.reduce((s,x)=>s+x.amount,0);metrics.push(['Gereden km (EV-registraties)',est.km?num(est.km,0)+' km':'—'],['Gemiddeld verbruik',est.km?num(est.energy/est.km*100)+' kWh/100 km':'—'],['Geschat energieverbruik',est.km?num(est.energy)+' kWh':'—'],['Extern geladen',num(total)+' kWh'],['Externe laadkosten',money(cost)],['Gem. externe laadprijs',total?money(cost/total)+'/kWh':'—'],['Geschat thuisladen',num(sum(evPeriods(v.id).filter(x=>x.valid),'home'))+' kWh'],['Geschatte thuislaadkosten',money(sum(evPeriods(v.id).filter(x=>x.valid),'homeCost'))],['Totale geschatte laadkosten',evPeriods(v.id).every(x=>x.valid)?money(cost+sum(evPeriods(v.id),'homeCost')):'Onvolledig'])}else{const s=fuelStats(f);metrics.push(['Gereden km (vol-tot-vol)',s.km?num(s.km,0)+' km':'—'],['Gemiddeld verbruik',s.km?num(s.liters/s.km*100)+' l/100 km':'—'],['Totaal getankt',money(f.reduce((a,x)=>a+x.amount,0))],['Gem. literprijs',f.reduce((a,x)=>a+x.liters,0)?money(f.reduce((a,x)=>a+x.amount,0)/f.reduce((a,x)=>a+x.liters,0))+'/l':'—'],['Kosten per km (vol-tot-vol)',s.km?money(s.cost/s.km)+'/km':'—'])}return `<section class="card">${selector()}</section><section class="card"><h2>Dashboard – ${escapeHtml(v.name)}</h2><div class="grid">${metrics.map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div>${isEv?'<p class="notice">Geschat rijverbruik, extern geladen energie en externe laadkosten zijn verschillende grootheden. Externe laadkosten zijn niet noodzakelijk alle energiekosten.</p>':'<p class="muted">Verbruik en kosten per km worden uitsluitend berekend voor betrouwbare vol-tot-voltrajecten.</p>'}</section><button onclick="tabs('records')">Registratie toevoegen</button>`}
function fuelStats(a){let km=0,liters=0,cost=0,anchor=null,accL=0,accC=0;for(const r of a){if(anchor&&r.km<=anchor.km){anchor=null;accL=0;accC=0}if(anchor){accL+=r.liters;accC+=r.amount;if(r.full){km+=r.km-anchor.km;liters+=accL;cost+=accC;anchor=r;accL=0;accC=0}}else if(r.full){anchor=r;accL=0;accC=0}}return {km,liters,cost}}
function evStats(a){let km=0,energy=0;for(let i=1;i<a.length;i++){const d=a[i].km-a[i-1].km;if(d>0){km+=d;energy+=d*a[i].avg/100}}return {km,energy}}
function vehiclesPage(){return `<section class="card"><h2>${editing?.kind==='vehicle'?'Voertuig wijzigen':'Voertuig toevoegen'}</h2><form id="vehicleForm"><div class="grid"><div><label>Naam *</label><input name="name" required maxlength="80" value="${escapeHtml(editing?.data.name||'')}"></div><div><label>Merk</label><input name="brand" maxlength="60" value="${escapeHtml(editing?.data.brand||'')}"></div><div><label>Model</label><input name="model" maxlength="60" value="${escapeHtml(editing?.data.model||'')}"></div><div><label>Kenteken</label><input name="plate" maxlength="20" value="${escapeHtml(editing?.data.plate||'')}"></div><div><label>Aandrijving</label><select name="type">${['benzine','diesel','ev'].map(t=>`<option value="${t}" ${editing?.data.type===t?'selected':''}>${t==='ev'?'Elektrisch':t}</option>`).join('')}</select></div><div><label>Beginstand / actuele km-stand</label><input name="km" type="number" min="0" step="1" required value="${editing?.data.km??0}"></div></div><div class="actions"><button type="submit">Opslaan</button>${editing?'<button type="button" class="secondary" onclick="cancelEdit()">Annuleren</button>':''}</div><p id="formError" class="error"></p></form></section><section class="card"><h2>Voertuigen</h2><div class="tablewrap"><table><thead><tr><th>Naam</th><th>Merk/model</th><th>Aandrijving</th><th>Kenteken</th><th>Acties</th></tr></thead><tbody>${state.vehicles.map(v=>`<tr><td>${escapeHtml(v.name)}</td><td>${escapeHtml([v.brand,v.model].filter(Boolean).join(' '))}</td><td>${escapeHtml(v.type)}</td><td>${escapeHtml(v.plate)}</td><td><button class="secondary" onclick="editItem('vehicle','${v.id}')">Wijzig</button><button class="danger" onclick="removeItem('vehicle','${v.id}')">Verwijder</button></td></tr>`).join('')}</tbody></table></div></section>`}
function recordsPage(){if(!vehicle())return '<section class="card">Voeg eerst een voertuig toe.</section>';const v=vehicle(),ev=v.type==='ev',types=ev?['odometer','charge']:['fuel'];const kind=editing&&types.includes(editing.kind)?editing.kind:types[0],d=editing?.kind===kind?editing.data:{};const fields={fuel:`${field('Datum','date','date',d.date||date())}${field('Kilometerstand','km','number',d.km??'', 'min="0" step="1"')}${field('Liters','liters','number',d.liters??'', 'min="0.001" step="0.001"')}${field('Literprijs (€)','price','number',d.price??'', 'min="0" step="0.0001"')}<div><label>Tankbeurt</label><select name="full"><option value="true" ${d.full!==false?'selected':''}>Volledig</option><option value="false" ${d.full===false?'selected':''}>Gedeeltelijk</option></select></div>`,odometer:`${field('Datum','date','date',d.date||date())}${field('Kilometerstand','km','number',d.km??'', 'min="0" step="1"')}${field('Gemiddeld kWh/100 km','avg','number',d.avg??'', 'min="0" step="0.01"')}${field('Thuisstroomtarief (€/kWh)','homeRate','number',d.homeRate??0.25, 'min="0" step="0.0001"')}${field('Opmerking','note','text',d.note||'','maxlength="250"')}`,charge:`${field('Datum','date','date',d.date||date())}${field('Geladen kWh','kwh','number',d.kwh??'', 'min="0.001" step="0.001"')}${field('Betaald bedrag (€)','amount','number',d.amount??'', 'min="0" step="0.01"')}`};return `<section class="card">${selector()}</section><section class="card"><h2>${editing?'Registratie wijzigen':'Registratie toevoegen'}</h2>${recordWarning(v.id,ev?'odometer':'fuel')}<div class="actions">${types.map(t=>`<button class="${kind===t?'':'secondary'}" onclick="chooseKind('${t}')">${{fuel:'Tankbeurt',odometer:'Kilometerregistratie',charge:'Externe laadsessie'}[t]}</button>`).join('')}</div><form id="recordForm" data-kind="${kind}"><div class="grid" style="margin-top:15px">${fields[kind]}</div><div class="actions"><button type="submit">Opslaan</button>${editing?'<button type="button" class="secondary" onclick="cancelEdit()">Annuleren</button>':''}</div><p id="formError" class="error"></p></form></section>${types.map(t=>recordsTable(t,v.id)).join('')}`}
function field(label,name,type,value,extra=''){return `<div><label>${label}${['date','km','liters','price','avg','kwh','amount'].includes(name)?' *':''}</label><input name="${name}" type="${type}" ${extra} ${['date','km','liters','price','avg','kwh','amount'].includes(name)?'required':''} value="${escapeHtml(value)}"></div>`}
function recordsTable(kind,id){const a=sorted(state[kind==='charge'?'charges':kind].filter(x=>x.vehicleId===id)).reverse(),titles={fuel:'Tankbeurten',odometer:'Kilometerregistraties',charge:'Externe laadsessies'};return `<section class="card"><h2>${titles[kind]}</h2>${a.length?`<div class="tablewrap"><table><thead><tr>${(kind==='fuel'?['Datum','Km','Liters','Prijs/l','Totaal','Vol']:kind==='odometer'?['Datum','Km','kWh/100 km','Opmerking']:['Datum','kWh','Bedrag','€/kWh','Locatie']).map(x=>`<th>${x}</th>`).join('')}<th>Acties</th></tr></thead><tbody>${a.map(r=>`<tr>${(kind==='fuel'?[r.date,num(r.km,0),num(r.liters,3),money(r.price),money(r.amount),r.full?'Ja':'Nee']:kind==='odometer'?[r.date,num(r.km,0),num(r.avg),escapeHtml(r.note)]:[r.date,num(r.kwh,3),money(r.amount),money(r.amount/r.kwh),escapeHtml(r.location)]).map(x=>`<td>${x}</td>`).join('')}<td><button class="secondary" onclick="editItem('${kind}','${r.id}')">Wijzig</button><button class="danger" onclick="removeItem('${kind}','${r.id}')">Verwijder</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nog geen registraties.</p>'}</section>`}
function backupPage(){return `<section class="card"><h2>Back-up en gegevensbeheer</h2><p>De gegevens staan alleen in deze browser op dit apparaat. Maak regelmatig een back-up. Wissen van browsergegevens kan alle registraties verwijderen.</p><div class="actions"><button id="export">Exporteer JSON-back-up</button><label class="button" for="importFile">Importeer JSON-back-up</label><input id="importFile" type="file" accept=".json,application/json" style="display:none"></div><p class="notice">Importeren vervangt alle huidige gegevens. Exporteer eerst een back-up.</p></section>`}
function attach(){if($('vehicleForm'))$('vehicleForm').onsubmit=submitVehicle;if($('recordForm'))$('recordForm').onsubmit=submitRecord;if($('export'))$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`p03-backup-${date()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('importFile'))$('importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const x=JSON.parse(await file.text());if(!validBackup(x))throw Error('Ongeldig P03-back-upbestand');if(!confirm('Alle huidige gegevens vervangen door deze back-up?'))return;if(commit(x)){selected='';render()}}catch(err){alert('Importeren mislukt: '+err.message)}}}
function validBackup(x){if(!x||!['vehicles','fuel','odometer','charges'].every(k=>Array.isArray(x[k])))return false;const ids=new Set();for(const v of x.vehicles){if(!v||typeof v.id!=='string'||ids.has(v.id)||typeof v.name!=='string'||!['benzine','diesel','ev'].includes(v.type)||!Number.isSafeInteger(v.km)||v.km<0)return false;ids.add(v.id)}for(const [key,kind] of [['fuel','fuel'],['odometer','odometer'],['charges','charge']])for(const r of x[key]){if(!r||typeof r.id!=='string'||!ids.has(r.vehicleId)||!validDate(r.date))return false;if(kind==='fuel'&&!(positive(r.liters)&&nonnegative(r.price)&&nonnegative(r.amount)&&Number.isSafeInteger(r.km)&&r.km>=0&&typeof r.full==='boolean'))return false;if(kind==='odometer'&&!(Number.isSafeInteger(r.km)&&r.km>=0&&nonnegative(r.avg)&&(r.homeRate===undefined||nonnegative(r.homeRate))))return false;if(kind==='charge'&&!(positive(r.kwh)&&nonnegative(r.amount)))return false}return true}
const positive=n=>typeof n==='number'&&Number.isFinite(n)&&n>0,nonnegative=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0,validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
function err(s){$('formError').textContent=s}function submitVehicle(e){e.preventDefault();const f=new FormData(e.target),km=Number(f.get('km')),name=String(f.get('name')).trim(),type=f.get('type');if(!name||!Number.isSafeInteger(km)||km<0)return err('Controleer naam en kilometerstand.');const old=editing?.kind==='vehicle'?editing.data:null;if(old&&old.type!==type&&['fuel','odometer','charges'].some(k=>state[k].some(r=>r.vehicleId===old.id)))return err('Aandrijving wijzigen is niet mogelijk zolang er registraties zijn.');const item={id:old?.id||uid(),name,brand:String(f.get('brand')).trim(),model:String(f.get('model')).trim(),plate:String(f.get('plate')).trim(),type,km};const next=structuredClone(state);next.vehicles=old?next.vehicles.map(v=>v.id===old.id?item:v):[...next.vehicles,item];if(commit(next)){selected=item.id;editing=null;render()}}
function submitRecord(e){e.preventDefault();const kind=e.target.dataset.kind,key=kind==='charge'?'charges':kind,f=new FormData(e.target),old=editing?.kind===kind?editing.data:null;let r={id:old?.id||uid(),vehicleId:selected,date:String(f.get('date'))};if(!validDate(r.date))return err('Ongeldige datum.');if(kind==='fuel'){r.km=Number(f.get('km'));r.liters=Number(f.get('liters'));r.price=Number(f.get('price'));r.amount=Math.round((r.liters*r.price+Number.EPSILON)*100)/100;r.full=f.get('full')==='true';if(!Number.isSafeInteger(r.km)||r.km<0||!positive(r.liters)||!nonnegative(r.price)||!Number.isFinite(r.amount))return err('Controleer kilometerstand, liters en literprijs.')}else if(kind==='odometer'){r.km=Number(f.get('km'));r.avg=Number(f.get('avg'));r.note=String(f.get('note')).trim();r.homeRate=Number(f.get('homeRate'));if(!Number.isSafeInteger(r.km)||r.km<0||!nonnegative(r.avg)||!nonnegative(r.homeRate))return err('Controleer kilometerstand en gemiddeld verbruik.')}else{r.kwh=Number(f.get('kwh'));r.amount=Number(f.get('amount'));r.location=String(f.get('location')??old?.location??'').trim();r.provider=String(f.get('provider')??old?.provider??'').trim();r.note=String(f.get('note')??old?.note??'').trim();if(!positive(r.kwh)||!nonnegative(r.amount))return err('Controleer geladen kWh en betaald bedrag.')}const next=structuredClone(state);next[key]=old?next[key].map(x=>x.id===old.id?r:x):[...next[key],r];if(kind!=='charge'){
 const problems=recordConflicts(next,key,selected);
 if(problems.length){
  const explanation='De wijziging veroorzaakt of behoudt '+problems.length+' traject(en) met niet-stijgende kilometerstanden.\n'+problems.slice(0,3).join('\n')+'\n\nDeze trajecten worden niet meegenomen in verbruiksberekeningen. Toch opslaan?';
  if(!confirm(explanation))return;
 }
 }if(commit(next)){editing=null;render()}}
// Historische correcties mogen worden opgeslagen; onlogische trajecten worden uitgesloten van verbruiksberekeningen.
function recordConflicts(data,kind,id){
 const a=sorted(data[kind].filter(x=>x.vehicleId===id));const bad=[];
 for(let i=1;i<a.length;i++){
  if(a[i].km<=a[i-1].km)bad.push(`${a[i-1].date} (${a[i-1].km} km) → ${a[i].date} (${a[i].km} km)`);
 }
 return bad;
}
function recordWarning(id,kind){
 const bad=recordConflicts(state,kind,id);
 return bad.length?`<p class="notice" role="alert"><strong>Controleer historische kilometerstanden:</strong> ${bad.length} traject(en) hebben een niet-stijgende kilometerstand. Deze trajecten tellen niet mee voor het berekende verbruik. ${escapeHtml(bad.slice(0,2).join('; '))}${bad.length>2?' …':''}</p>`:'';
}
function chooseKind(k){editing={kind:k,data:{}};render()}function cancelEdit(){editing=null;render()}function editItem(kind,id){const key=kind==='vehicle'?'vehicles':kind==='charge'?'charges':kind;const item=state[key].find(x=>x.id===id);if(!item)return;editing={kind,data:item};if(kind==='vehicle')page='vehicles';else{page='records';selected=item.vehicleId}render();window.scrollTo(0,0)}function removeItem(kind,id){const key=kind==='vehicle'?'vehicles':kind==='charge'?'charges':kind,item=state[key].find(x=>x.id===id);if(!item)return;const count=kind==='vehicle'?['fuel','odometer','charges'].reduce((n,k)=>n+state[k].filter(x=>x.vehicleId===id).length,0):0;if(!confirm(kind==='vehicle'?`Voertuig '${item.name}' en ${count} bijbehorende registraties definitief verwijderen?`:'Deze registratie definitief verwijderen?'))return;const next=structuredClone(state);next[key]=next[key].filter(x=>x.id!==id);if(kind==='vehicle')for(const k of ['fuel','odometer','charges'])next[k]=next[k].filter(x=>x.vehicleId!==id);if(commit(next)){editing=null;render()}}
// Rapportagefuncties worden hieronder toegevoegd.

const REPORT_TARIFF=0.25;
let reportType='year',reportVehicle='all',reportStart='',reportEnd='';
const inRange=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
const reportVehicles=()=>reportVehicle==='all'?state.vehicles:state.vehicles.filter(v=>v.id===reportVehicle);
const dateMonth=d=>d.slice(0,7);
const priceText=(cost,qty,unit)=>qty>0?money(cost/qty)+'/'+unit:'—';
function fuelSegments(records){const a=sorted(records);let anchor=null,accL=0,accC=0,out=[];
 for(const r of a){if(anchor&&r.km<=anchor.km){anchor=null;accL=0;accC=0}
 if(anchor){accL+=r.liters;accC+=r.amount;if(r.full){out.push({start:anchor.date,date:r.date,km:r.km-anchor.km,energy:accL,cost:accC});anchor=r;accL=0;accC=0}}
 else if(r.full){anchor=r;accL=0;accC=0}}
 return out;
}
function evPeriods(id){const a=sorted(state.odometer.filter(x=>x.vehicleId===id)),c=state.charges.filter(x=>x.vehicleId===id),out=[];
 for(let i=1;i<a.length;i++){const prev=a[i-1],cur=a[i],km=cur.km-prev.km;if(km<=0||!Number.isFinite(cur.avg))continue;
 const external=c.filter(x=>x.date>prev.date&&x.date<=cur.date),externalKwh=external.reduce((v,x)=>v+x.kwh,0),externalCost=external.reduce((v,x)=>v+x.amount,0);
 const energy=km*cur.avg/100,home=energy-externalKwh,rate=cur.homeRate??REPORT_TARIFF;
 out.push({start:prev.date,date:cur.date,km,energy,avg:cur.avg,externalKwh,externalCost,home,homeCost:home>=0?home*rate:null,rate,valid:home>=-1e-8});
 }return out;
}
function reportRows(){const rows=[];for(const v of reportVehicles()){
 if(v.type==='ev'){for(const r of evPeriods(v.id))if(inRange(r.date,reportStart,reportEnd))rows.push({...r,vehicle:v.name,type:'ev',id:v.id});}
 else{for(const r of fuelSegments(state.fuel.filter(x=>x.vehicleId===v.id)))if(inRange(r.date,reportStart,reportEnd))rows.push({...r,vehicle:v.name,type:'fuel',id:v.id});}
 }return rows.sort((a,b)=>a.date.localeCompare(b.date));}
function reportCharges(){return state.charges.filter(x=>reportVehicles().some(v=>v.id===x.vehicleId)&&inRange(x.date,reportStart,reportEnd));}
function reportFuel(){return state.fuel.filter(x=>reportVehicles().some(v=>v.id===x.vehicleId)&&inRange(x.date,reportStart,reportEnd));}
function tableReport(headers,rows){return `<div class="tablewrap"><table class="reporttable"><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Geen gegevens voor deze selectie.</td></tr>`}</tbody></table></div>`}
function sum(a,key){return a.reduce((s,x)=>s+(x[key]||0),0)}
function evTotals(id){const p=evPeriods(id).filter(x=>inRange(x.date,reportStart,reportEnd)),valid=p.filter(x=>x.valid),c=state.charges.filter(x=>x.vehicleId===id&&inRange(x.date,reportStart,reportEnd));return {p,valid,c,km:sum(p,'km'),energy:sum(p,'energy'),home:sum(valid,'home'),homeCost:sum(valid,'homeCost'),externalKwh:sum(c,'kwh'),externalCost:sum(c,'amount'),incomplete:valid.length!==p.length};}
function reportAnnual(){let lines=[];for(const v of reportVehicles()){
 if(v.type==='ev'){const years=[...new Set([...state.odometer.filter(x=>x.vehicleId===v.id).map(x=>x.date.slice(0,4)),...state.charges.filter(x=>x.vehicleId===v.id).map(x=>x.date.slice(0,4))])].sort();for(const y of years){if((reportStart&&y+'-12-31'<reportStart)||(reportEnd&&y+'-01-01'>reportEnd))continue;const p=evPeriods(v.id).filter(x=>x.date.startsWith(y)&&inRange(x.date,reportStart,reportEnd)),valid=p.filter(x=>x.valid),c=state.charges.filter(x=>x.vehicleId===v.id&&x.date.startsWith(y)&&inRange(x.date,reportStart,reportEnd));const km=sum(p,'km'),e=sum(p,'energy'),homeCost=sum(valid,'homeCost'),extCost=sum(c,'amount');lines.push([escapeHtml(v.name),y,km?num(km,0):'—',km?num(e/km*100)+' kWh/100 km':'—',valid.length===p.length?money(homeCost):'Onvolledig',money(extCost),valid.length===p.length?money(homeCost+extCost):'Onvolledig']);}
 }else{const years=[...new Set(state.fuel.filter(x=>x.vehicleId===v.id).map(x=>x.date.slice(0,4)))].sort();for(const y of years){const f=state.fuel.filter(x=>x.vehicleId===v.id&&x.date.startsWith(y)&&inRange(x.date,reportStart,reportEnd)),p=fuelSegments(state.fuel.filter(x=>x.vehicleId===v.id)).filter(x=>x.date.startsWith(y)&&inRange(x.date,reportStart,reportEnd));if(!f.length&&!p.length)continue;const km=sum(p,'km'),l=sum(p,'energy');lines.push([escapeHtml(v.name),y,km?num(km,0):'—',km?num(l/km*100)+' l/100 km':'—','—',money(sum(f,'amount')),money(sum(f,'amount'))]);}}
 }return `<p class="reportnote">Brandstofkosten zijn betaalde tankbedragen; EV-kosten bestaan uit geschat thuisladen en werkelijk extern laden. Kilometer- en verbruikscijfers gebruiken afgesloten registratieperiodes.</p>`+tableReport(['Voertuig','Jaar','Km','Gem. verbruik','Thuis (€)','Tank / extern (€)','Totaal (€)'],lines);}
function reportConsumption(){const rows=reportRows();return `<p class="reportnote">Verbruik per afgerond vol-tot-voltraject of EV-kilometerperiode. Brandstof en EV worden niet in één gemiddelde samengevoegd.</p>`+tableReport(['Voertuig','Einddatum','Afstand','Energie','Verbruik'],rows.map(r=>[escapeHtml(r.vehicle),r.date,num(r.km,0)+' km',num(r.energy)+(r.type==='ev'?' kWh':' l'),num(r.energy/r.km*100)+(r.type==='ev'?' kWh/100 km':' l/100 km')]));}
function reportCosts(){let rows=[];for(const v of reportVehicles())if(v.type==='ev'){const t=evTotals(v.id);rows.push([escapeHtml(v.name),money(t.homeCost)+(t.incomplete?' (onvolledig)':''),money(t.externalCost),t.incomplete?'Onvolledig':money(t.homeCost+t.externalCost)]);}else{const f=state.fuel.filter(x=>x.vehicleId===v.id&&inRange(x.date,reportStart,reportEnd));rows.push([escapeHtml(v.name),'—',money(sum(f,'amount')),money(sum(f,'amount'))]);}return `<p class="reportnote">Kosten worden gefilterd op de opgegeven datums. Thuislaadkosten zijn schattingen voor EV-periodes die binnen de selectie eindigen; externe kosten volgen de sessiedatum. Bij een onmogelijke thuislaadberekening is het totaal onvolledig.</p>`+tableReport(['Voertuig','Geschat thuisladen','Tank / extern','Totaal'],rows);}
function reportCompare(){const rows=[];for(const v of reportVehicles()){if(v.type==='ev'){const t=evTotals(v.id);rows.push([escapeHtml(v.name),num(t.km,0),t.km?num(t.energy/t.km*100)+' kWh/100 km':'—',money(t.externalCost),t.incomplete?'Onvolledig':money(t.homeCost+t.externalCost)]);}else{const p=fuelSegments(state.fuel.filter(x=>x.vehicleId===v.id)).filter(x=>inRange(x.date,reportStart,reportEnd)),km=sum(p,'km'),liters=sum(p,'energy'),cost=sum(state.fuel.filter(x=>x.vehicleId===v.id&&inRange(x.date,reportStart,reportEnd)),'amount');rows.push([escapeHtml(v.name),num(km,0),km?num(liters/km*100)+' l/100 km':'—',money(cost),money(cost)]);}}return `<p class="reportnote">EV-totaal omvat geschatte thuislaadkosten plus externe laadkosten; dit is niet direct gelijkwaardig aan werkelijk betaalde brandstofkosten.</p>`+tableReport(['Voertuig','Km (berekend)','Verbruik','Betaalde tank/extern','Totaal incl. thuis (schatting)'],rows);}
function reportHistory(){const f=reportFuel().map(x=>[x.date,state.vehicles.find(v=>v.id===x.vehicleId)?.name||'', 'Tankbeurt',num(x.liters,3)+' l',money(x.amount)]),c=reportCharges().map(x=>[x.date,state.vehicles.find(v=>v.id===x.vehicleId)?.name||'','Extern laden',num(x.kwh,3)+' kWh',money(x.amount)]);return tableReport(['Datum','Voertuig','Soort','Hoeveelheid','Bedrag'],[...f,...c].sort((a,b)=>b[0].localeCompare(a[0])).map(r=>r.map(escapeHtml)));}
function reportEv(){const rows=[];for(const v of reportVehicles().filter(v=>v.type==='ev'))for(const p of evPeriods(v.id).filter(x=>inRange(x.date,reportStart,reportEnd)))rows.push([escapeHtml(v.name),escapeHtml(p.start)+' → '+escapeHtml(p.date),num(p.km,0),num(p.energy),num(p.externalKwh),p.valid?num(p.home):'<span class="reportbad">Afwijking</span>',p.valid?money(p.homeCost):'—',money(p.externalCost),p.valid?money(p.homeCost+p.externalCost):'—']);return `<p class="reportnote">Extern geladen kWh wordt toegerekend aan de periode na de vorige km-registratie tot en met de huidige datum. Dit is een schatting: acculading en laadverliezen kunnen verschillen veroorzaken. Een negatieve uitkomst wordt als afwijking gemeld, niet als negatief thuisladen.</p>`+tableReport(['Voertuig','Periode','Km','Geschat kWh','Extern kWh','Thuis kWh (geschat)','Thuis €','Extern €','Totaal €'],rows);}
function reportRolling(){const rows=[];
 for(const v of reportVehicles()){
  if(v.type==='ev'){
   const periods=evPeriods(v.id).filter(x=>inRange(x.date,reportStart,reportEnd));
   const valid=periods.filter(x=>x.valid);
   const charges=state.charges.filter(x=>x.vehicleId===v.id&&inRange(x.date,reportStart,reportEnd));
   const km=sum(periods,'km'),energy=sum(periods,'energy');
   const home=sum(valid,'home'),homeCost=sum(valid,'homeCost');
   const extKwh=sum(charges,'kwh'),extCost=sum(charges,'amount');
   const complete=valid.length===periods.length;
   rows.push([escapeHtml(v.name),'EV',priceText(homeCost,home,'kWh'),priceText(extCost,extKwh,'kWh'),complete?priceText(homeCost+extCost,home+extKwh,'kWh'):'Onvolledig',km?num(energy/km*100)+' kWh/100 km':'—',complete&&km?money((homeCost+extCost)/km)+'/km':'—']);
  }else{
   const fills=state.fuel.filter(x=>x.vehicleId===v.id&&inRange(x.date,reportStart,reportEnd));
   // Rapport 7: iedere tankbeurt geldt als volledig. De eerste is de beginstand.
   const allFills=sorted(state.fuel.filter(x=>x.vehicleId===v.id));
   let km=0,used=0,segmentCost=0;
   for(let i=1;i<allFills.length;i++){
    const prev=allFills[i-1],cur=allFills[i],distance=cur.km-prev.km;
    if(distance<=0||cur.date<prev.date||!inRange(cur.date,reportStart,reportEnd))continue;
    km+=distance;used+=cur.liters;segmentCost+=cur.amount;
   }
   const liters=sum(fills,'liters'),cost=sum(fills,'amount');
   rows.push([escapeHtml(v.name),escapeHtml(v.type),'—','—',priceText(cost,liters,'l'),km?num(used/km*100)+' l/100 km':'—',km?money(segmentCost/km)+'/km':'—']);
  }
 }
 return `<p class="reportnote">Eén regel per voertuig over de gekozen periode. Verbruik is gewogen naar gereden kilometers; brandstofprijzen naar getankte liters en externe laadprijzen naar geladen kWh. EV-thuisladen, de gecombineerde prijs en EV-kosten per km zijn schattingen. Voor brandstofvoertuigen telt in dit rapport iedere tankbeurt als volledig; verbruik en kosten per km gebruiken opeenvolgende geldige kilometertrajecten. EV-kosten per km gebruiken thuislaadkosten van geselecteerde kilometerperiodes plus externe laadkosten op geselecteerde sessiedatums; deze periodes kunnen afwijken. Meettrajecten worden toegerekend aan hun einddatum; laadsessies en tankbeurten aan hun registratiedatum.</p>`+tableReport(['Voertuig','Aandrijving','Thuis €/kWh (geschat)','Extern €/kWh','Gem. prijs (€/l of €/kWh)','Gem. verbruik','Gem. kosten €/km'],rows);
}
function reportsPage(){const options=[['year','1. Jaaroverzicht'],['consumption','2. Verbruik door de tijd'],['costs','3. Kosten per periode'],['compare','4. Voertuigen vergelijken'],['history','5. Tank- en laadhistorie'],['ev','6. EV-energierapport'],['rolling','7. Voortschrijdende gemiddelden']];let html={year:reportAnnual,consumption:reportConsumption,costs:reportCosts,compare:reportCompare,history:reportHistory,ev:reportEv,rolling:reportRolling}[reportType]();return `<section class="card"><h2>Rapportages</h2><div class="reportfilters"><div><label>Rapport</label><select id="reportType">${options.map(([k,n])=>`<option value="${k}" ${k===reportType?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Voertuig</label><select id="reportVehicle"><option value="all">Alle voertuigen</option>${state.vehicles.map(v=>`<option value="${escapeHtml(v.id)}" ${reportVehicle===v.id?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}</select></div><div><label>Van datum</label><input id="reportStart" type="date" value="${reportStart}"></div><div><label>Tot en met</label><input id="reportEnd" type="date" value="${reportEnd}"></div></div><p class="reportnote">Lege datums betekenen: volledige historie. Periodieke verbruikscijfers worden toegerekend aan de einddatum van de meetperiode.</p></section><section class="card"><h2>${options.find(x=>x[0]===reportType)[1]}</h2>${html}</section>`;}
function attachReportFilters(){for(const [id,setter] of [['reportType',v=>reportType=v],['reportVehicle',v=>reportVehicle=v],['reportStart',v=>reportStart=v],['reportEnd',v=>reportEnd=v]]){const el=$(id);if(el)el.onchange=e=>{setter(e.target.value);render()};}}
const originalAttach=attach;attach=function(){originalAttach();attachReportFilters();};

load();render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
